{# ✓ — mark a task done and close its calendar event. Needs: key, choices, label. #}
{% if choices|length > 1 %}<details class="done-menu"><summary class="btn small donebtn" title="Mark done" aria-label="Mark done">✓</summary>
  <div class="done-pop">{% for w in choices %}<form method="post" action="{% url 'mark_done' %}">{% csrf_token %}<input type="hidden" name="key" value="{{ key }}"><input type="hidden" name="word" value="{{ w }}"><input type="hidden" name="next" value="{{ request.get_full_path }}"><button class="btn small">{% if w == "SUBMITTED" %}Handed in / uploaded{% elif w == "DONE" %}Done, nothing to upload{% elif w == "READ" %}Read{% else %}Attended{% endif %}</button></form>{% endfor %}</div>
</details>{% else %}<form method="post" action="{% url 'mark_done' %}" data-confirm="Mark “{{ label|truncatechars:60 }}” as ✅ {{ choices.0|default:'DONE' }}?">{% csrf_token %}<input type="hidden" name="key" value="{{ key }}"><input type="hidden" name="word" value="{{ choices.0|default:'DONE' }}"><input type="hidden" name="next" value="{{ request.get_full_path }}"><button class="btn small donebtn" title="Mark done" aria-label="Mark done">✓</button></form>{% endif %}
